<!doctype html><html><body><script>
window.setup = async (scene, texUrls) => {
  window.S = scene; window.TEXS = {};
  for (const [k, url] of Object.entries(texUrls)) { const img = new Image(); img.src = url; await img.decode(); TEXS[k] = img; }
  window.TEX = Object.values(TEXS)[0];
};
const tintCache = {};
function texFor(mesh) {
  const base = TEXS[mesh.tex] || TEX;
  if (mesh.tint == null) return base;
  const key = mesh.tex + '|' + mesh.tint;
  if (!tintCache[key]) {
    const c = document.createElement('canvas'); c.width = base.width; c.height = base.height; const x = c.getContext('2d');
    x.drawImage(base, 0, 0); x.globalCompositeOperation = window.TINT_MODE || 'overlay';
    x.fillStyle = '#' + mesh.tint.toString(16).padStart(6, '0'); x.fillRect(0, 0, c.width, c.height);
    x.globalCompositeOperation = 'destination-in'; x.drawImage(base, 0, 0);
    tintCache[key] = c;
  }
  return tintCache[key];
}
// Transformation de couleur des bones (comme le jeu) : rgb * mul/127 + add (octet signé x2). Calculée sur la zone UV du mesh.
const colorCache = {};
function colorFor(mesh, sym, T, mul, add) {
  const ident = !add || (mul[0] === 127 && mul[1] === 127 && mul[2] === 127 && !add[0] && !add[1] && !add[2]);
  if (ident || window.NO_COLOR) return [T, 0, 0];
  const key = sym + '|' + mul + '|' + add;
  if (!colorCache[key]) {
    const W = T.width, H = T.height; let x0 = W, y0 = H, x1 = 0, y1 = 0;
    for (const v of mesh.v) { const u = v[2]*W, w = (1 - v[3])*H; x0 = Math.min(x0, u); y0 = Math.min(y0, w); x1 = Math.max(x1, u); y1 = Math.max(y1, w); }
    x0 = Math.max(0, Math.floor(x0) - 1); y0 = Math.max(0, Math.floor(y0) - 1); x1 = Math.min(W, Math.ceil(x1) + 1); y1 = Math.min(H, Math.ceil(y1) + 1);
    const c = document.createElement('canvas'); c.width = Math.max(1, x1 - x0); c.height = Math.max(1, y1 - y0); const g = c.getContext('2d');
    g.drawImage(T, -x0, -y0); const d = g.getImageData(0, 0, c.width, c.height); const p = d.data;
    const sg = b => (b > 127 ? b - 256 : b) * 2;
    const ar = sg(add[0]), ag = sg(add[1]), ab = sg(add[2]), mr = mul[0]/127, mg = mul[1]/127, mb = mul[2]/127;
    for (let i = 0; i < p.length; i += 4) { p[i] = p[i]*mr + ar; p[i+1] = p[i+1]*mg + ag; p[i+2] = p[i+2]*mb + ab; }
    g.putImageData(d, 0, 0); colorCache[key] = [c, x0, y0];
  }
  return colorCache[key];
}
function xf(m, x, y, flipY) { const X = m[0]*x + m[1]*y + m[2], Y = m[3]*x + m[4]*y + m[5]; return [X, flipY ? -Y : Y]; }
window.bounds = (anim, flipY) => {
  let b = [1e9,1e9,-1e9,-1e9];
  for (const fr of S.anims[anim]) for (const [sym, m] of fr) for (const v of S.meshes[sym].v) {
    const [X,Y] = xf(m, v[0], flipY ? v[1] : -v[1], flipY); b=[Math.min(b[0],X),Math.min(b[1],Y),Math.max(b[2],X),Math.max(b[3],Y)];
  }
  return b;
};
window.renderFrame = (ctx, anim, fi, ox, oy, sc, flipY) => {
  for (const [sym, m, alpha, mul, add] of S.anims[anim][fi]) {
    const mesh = S.meshes[sym]; const T0 = texFor(mesh); const W = T0.width, H = T0.height;
    const [T, tx, ty] = colorFor(mesh, sym, T0, mul, add);
    ctx.globalAlpha = Math.max(0, Math.min(1, (alpha/127) * (mul[3]/127)));
    const P = mesh.v.map(v => { const [X,Y] = xf(m, v[0], flipY ? v[1] : -v[1], flipY); return [ox + X*sc, oy + Y*sc, v[2]*W, (1 - v[3])*H]; });
    for (let i = 0; i < mesh.t.length; i += 3) {
      const a = P[mesh.t[i]], b = P[mesh.t[i+1]], c = P[mesh.t[i+2]];
      // affine: texture (u,v) -> screen (x,y)
      const du1=b[2]-a[2], dv1=b[3]-a[3], du2=c[2]-a[2], dv2=c[3]-a[3];
      const det = du1*dv2 - du2*dv1; if (Math.abs(det) < 1e-9) continue;
      const dx1=b[0]-a[0], dy1=b[1]-a[1], dx2=c[0]-a[0], dy2=c[1]-a[1];
      const A = (dx1*dv2 - dx2*dv1)/det, C = (dx2*du1 - dx1*du2)/det;
      const B = (dy1*dv2 - dy2*dv1)/det, D = (dy2*du1 - dy1*du2)/det;
      const E = a[0] - A*a[2] - C*a[3], F = a[1] - B*a[2] - D*a[3];
      ctx.save(); ctx.beginPath();
      // léger gonflement du triangle pour éviter les fissures
      const cx=(a[0]+b[0]+c[0])/3, cy=(a[1]+b[1]+c[1])/3, g=(p)=>{const dx=p[0]-cx, dy=p[1]-cy, l=Math.hypot(dx,dy)||1; return [p[0]+dx/l*1.0, p[1]+dy/l*1.0];};
      const [a2,b2,c2]=[g(a),g(b),g(c)];
      ctx.moveTo(a2[0],a2[1]); ctx.lineTo(b2[0],b2[1]); ctx.lineTo(c2[0],c2[1]); ctx.closePath(); ctx.clip();
      ctx.setTransform(A, B, C, D, E, F); ctx.drawImage(T, tx, ty); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
};
window.sheet = (anims, sc, flipY, pad) => {
  // Une ligne par anim, cellules de taille commune
  let b=[1e9,1e9,-1e9,-1e9];
  for (const a of anims) { const c = bounds(a, flipY); b=[Math.min(b[0],c[0]),Math.min(b[1],c[1]),Math.max(b[2],c[2]),Math.max(b[3],c[3])]; }
  const cw = Math.ceil((b[2]-b[0])*sc) + pad*2, ch = Math.ceil((b[3]-b[1])*sc) + pad*2;
  const ox = -b[0]*sc + pad, oy = -b[1]*sc + pad;
  const cols = Math.max(...anims.map(a => S.anims[a].length));
  const cv = document.createElement('canvas'); cv.width = cw*cols; cv.height = ch*anims.length;
  const ctx = cv.getContext('2d'); const frames = {};
  anims.forEach((a, r) => S.anims[a].forEach((_, i) => {
    ctx.setTransform(1,0,0,1,0,0);
    ctx.save(); ctx.beginPath(); ctx.rect(i*cw, r*ch, cw, ch); ctx.clip();
    renderFrame(ctx, a, i, i*cw + ox, r*ch + oy, sc, flipY); ctx.restore();
    frames[`${a}_${i}`] = { frame: { x: i*cw, y: r*ch, w: cw, h: ch }, rotated: false, trimmed: false, spriteSourceSize: { x: 0, y: 0, w: cw, h: ch }, sourceSize: { w: cw, h: ch } };
  }));
  return { url: cv.toDataURL('image/png'), frames, cell: [cw, ch], origin: [ox, oy] };
};
// Planche à cellule fixe : boîte en unités monde, frames sous-échantillonnées, rangées repliées à maxW
window.sheetFixed = (specs, sc, flipY, box, maxW) => {
  const cw = Math.ceil((box[2]-box[0])*sc), ch = Math.ceil((box[3]-box[1])*sc), ox = -box[0]*sc, oy = -box[1]*sc;
  const list = [];
  for (const sp of specs) { const F = S.anims[sp.name].length; const n = Math.min(F, sp.max || F);
    for (let i = 0; i < n; i++) list.push([sp.out || sp.name, i, Math.min(F-1, Math.floor(i*F/n))]); }
  const cols = Math.max(1, Math.floor(maxW / cw)), rows = Math.ceil(list.length / cols);
  const cv = document.createElement('canvas'); cv.width = cols*cw; cv.height = rows*ch; const ctx = cv.getContext('2d'); const frames = {};
  const srcOf = {}; for (const sp of specs) srcOf[sp.out || sp.name] = sp.name;
  list.forEach(([name, i, f], k) => { const x = (k % cols)*cw, y = Math.floor(k / cols)*ch;
    ctx.setTransform(1,0,0,1,0,0); ctx.save(); ctx.beginPath(); ctx.rect(x, y, cw, ch); ctx.clip();
    renderFrame(ctx, srcOf[name], f, x+ox, y+oy, sc, flipY); ctx.restore();
    frames[`${name}_${i}`] = { frame: { x, y, w: cw, h: ch }, rotated: false, trimmed: false, spriteSourceSize: { x: 0, y: 0, w: cw, h: ch }, sourceSize: { w: cw, h: ch } }; });
  return { url: cv.toDataURL('image/png'), frames, cell: [cw, ch], origin: [ox, oy] };
};
window.contact = (anims, sc, flipY, cols) => {
  let b=[1e9,1e9,-1e9,-1e9];
  for (const a of anims) { const c = bounds(a, flipY); b=[Math.min(b[0],c[0]),Math.min(b[1],c[1]),Math.max(b[2],c[2]),Math.max(b[3],c[3])]; }
  const cw = Math.ceil((b[2]-b[0])*sc)+8, ch = Math.ceil((b[3]-b[1])*sc)+8, ox=-b[0]*sc+4, oy=-b[1]*sc+4;
  const cv = document.createElement('canvas'); cv.width = cw*cols; cv.height = ch*anims.length; const ctx = cv.getContext('2d');
  ctx.fillStyle='#3c5a3c'; ctx.fillRect(0,0,cv.width,cv.height); ctx.font='14px sans-serif';
  anims.forEach((a, r) => { const F = S.anims[a].length; for (let i=0;i<cols;i++) { const f=Math.min(F-1,Math.floor(i*F/cols));
    ctx.setTransform(1,0,0,1,0,0); ctx.save(); ctx.beginPath(); ctx.rect(i*cw, r*ch, cw, ch); ctx.clip();
    renderFrame(ctx, a, f, i*cw+ox, r*ch+oy, sc, flipY); ctx.restore(); ctx.fillStyle='#fff'; ctx.fillText(a+' '+f, i*cw+4, r*ch+16); } });
  return cv.toDataURL('image/png');
};
</script></body></html>
