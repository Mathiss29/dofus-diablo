name: Serveur
# Teste le serveur multijoueur. Le VPS se met à jour tout seul depuis main (diablofus-maj.timer), voir serveur/LISEZMOI.md.
on:
  push:
    branches: [main]
    paths: ['serveur/**', '.github/workflows/serveur.yml']
  pull_request:
    paths: ['serveur/**', '.github/workflows/serveur.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: serveur
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: serveur } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
