name: Pages
# Publie la version jouable de main sur GitHub Pages (https://diablofus.com/)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # fichiers lourds servis par Cloudflare R2 (tools/hebergement/LISEZMOI.md)
          VITE_ASSETS_URL: https://assets.diablofus.com
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  # Robot Discord : applique le plan des salons (tools/discord/serveur.json) puis publie le carnet du jour du Journal.
  # Sans le secret DISCORD_BOT_TOKEN, il ne fait rien (voir tools/discord/LISEZMOI.md).
  discord:
    needs: deploy
    runs-on: ubuntu-latest
    concurrency:
      group: discord
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Plan des salons
        env: { DISCORD_BOT_TOKEN: "${{ secrets.DISCORD_BOT_TOKEN }}", DISCORD_CATEGORIE: diablofus }
        run: node tools/discord/discord_bot.mjs plan --auto
      - name: Carnet du jour
        env: { DISCORD_BOT_TOKEN: "${{ secrets.DISCORD_BOT_TOKEN }}", DISCORD_CATEGORIE: diablofus, DISCORD_ROLE: Diablofus }
        run: node tools/discord/discord_bot.mjs journal --auto
