<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diablofus : Les Douze Enfers</title>
  <meta name="description" content="Action-RPG en temps réel dans le Monde des Douze, jouable dans le navigateur.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/icone-32.png">
  <link rel="apple-touch-icon" href="assets/logo/icone-180.png">
  <meta name="theme-color" content="#12141b">
  <meta property="og:title" content="Diablofus : Les Douze Enfers">
  <meta property="og:description" content="Action-RPG en temps réel dans le Monde des Douze, jouable dans le navigateur.">
  <meta property="og:image" content="https://diablofus.com/assets/logo/apercu.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800&display=swap">
  <style>
    /* Polices de l'interface de Dofus 3 (tss_assets_all) : Lexend pour les textes, Rowdies pour les boutons */
    @font-face { font-family: Lexend; font-weight: 400; font-display: swap; src: url(assets/fonts/Lexend-Regular.woff2) format('woff2'); }
    @font-face { font-family: Lexend; font-weight: 500; font-display: swap; src: url(assets/fonts/Lexend-Medium.woff2) format('woff2'); }
    @font-face { font-family: Lexend; font-weight: 600; font-display: swap; src: url(assets/fonts/Lexend-SemiBold.woff2) format('woff2'); }
    @font-face { font-family: Lexend; font-weight: 700; font-display: swap; src: url(assets/fonts/Lexend-Bold.woff2) format('woff2'); }
    @font-face { font-family: Rowdies; font-weight: 400 900; font-display: swap; src: url(assets/fonts/Rowdies-Regular.woff2) format('woff2'); }
    html, body { height: 100%; margin: 0; background: #12141b; color: #e8e2d4; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    #game canvas { display: block; }
    /* Écran de chargement (src/render/chargement.ts) : logo, braise qui pulse, barre de progression */
    #chargement { position: fixed; inset: 0; z-index: 40; display: grid; place-content: center; justify-items: center; gap: 3vh;
      background: radial-gradient(ellipse at 50% 45%, #232619, #12141b 70%); transition: opacity .25s; }
    #chargement[hidden] { display: none; }
    #chargement.discret { opacity: 0; transition: opacity .2s .15s; }
    #chargement.discret.vu { opacity: 1; }
    #chargement img { width: min(46vw, 82vh); height: auto; filter: drop-shadow(0 1vh 2.4vh #000c); animation: braise 2.6s ease-in-out infinite; }
    #chargement .barre { width: min(28vw, 50vh); height: 8px; border-radius: 6px; background: #2a2c22; overflow: hidden; box-shadow: 0 0 0 1px #000a; }
    #chargement .barre i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7a1f08, #ff8a1f, #ffc14d); transition: width .2s; }
    #chargement small { font: 700 13px Nunito, system-ui, sans-serif; color: #a7a28a; letter-spacing: .06em; }
    @keyframes braise { 0%, 100% { filter: drop-shadow(0 1vh 2.4vh #000c) drop-shadow(0 0 0 #b9e54b00); }
      50% { filter: drop-shadow(0 1vh 2.4vh #000c) drop-shadow(0 0 2.2vh #b9e54b66); } }
    @media (prefers-reduced-motion: reduce) { #chargement img { animation: none; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="chargement" role="status" aria-live="polite">
    <img src="assets/logo/logo.webp" alt="Diablofus : Les Douze Enfers" width="1400" height="575">
    <div class="barre"><i></i></div>
    <small>Chargement…</small>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
